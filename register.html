<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseX - Register</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/__/firebase/init.js" onerror="console.log('Firebase Hosting script not present, using client config');"></script>

  <style>
    :root {
      --primary-color: #7c3aed;
      --primary-dark: #6d28d9;
      --bg-color: #7b5ac6;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .register-container {
      width: 100%;
      max-width: 950px;
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .brand-header-center {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 1.5rem;
    }

    .brand-graphic {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-svg {
      width: 48px;
      height: 48px;
    }

    .brand-text-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--success);
    }

    .brand-name .x-accent {
      color: var(--primary-color);
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand-tagline .dash {
      display: inline-block;
      width: 10px;
      height: 1px;
      background-color: var(--primary-color);
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text-main);
    }

    .section-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    input, select {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #fff;
    }

    input:focus, select:focus {
      border-color: var(--success);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .checkbox-group input {
      width: auto;
    }

    .submit-btn {
      background-color: var(--success);
      color: white;
      border: none;
      padding: 0.875rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      background-color: #059669;
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    .login-link-text {
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }

    .login-link-text a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .login-link-text a:hover {
      text-decoration: underline;
    }

    .error-box {
      color: #ef4444;
      background: #fee2e2;
      padding: 0.6rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <header class="brand-header-center">
      <div class="brand-graphic">
        <svg viewBox="0 0 100 100" class="brand-svg">
          <path d="M 46 14 A 32 32 0 1 0 74 62" fill="none" stroke="#10b981" stroke-width="6.5" stroke-linecap="round" />
          <polygon points="46,6 46,22 34,14" fill="#10b981" />
          <text x="44" y="58" text-anchor="middle" font-size="34" font-weight="900" fill="#10b981" font-family="'Poppins', sans-serif">₹</text>
          <line x1="58" y1="46" x2="80" y2="24" stroke="#7c3aed" stroke-width="5.5" stroke-linecap="round" />
          <polygon points="85,20 72,21 82,32" fill="#7c3aed" />
          <path d="M 52 82 L 52 70 L 64 70 L 64 56 L 76 56 L 76 42 L 86 42 L 86 82 Z" fill="#7c3aed" />
        </svg>
      </div>
      <div class="brand-text-wrapper">
        <h1 class="brand-name">Expense<span class="x-accent">X</span></h1>
        <p class="brand-tagline"><span class="dash"></span> Track Expenses. Manage Better. Save More. <span class="dash"></span></p>
      </div>
    </header>

    <div class="section-title">Create New Account</div>
    <div class="section-subtitle">Sign up to manage and track your monthly expenses seamlessly</div>

    <div id="errorAlert" class="error-box"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullname">Full Name *</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </span>
          <input type="text" id="fullname" placeholder="Enter your full name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </span>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </span>
          <input type="tel" id="phone" placeholder="Enter your phone number" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input type="password" id="password" placeholder="Create a password" required minlength="6">
        </div>
        <small style="color: var(--text-muted); font-size: 0.75rem;">Password must be at least 6 characters long.</small>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password *</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          </span>
          <input type="password" id="confirm-password" placeholder="Re-enter your password" required minlength="6">
        </div>
      </div>

      <div class="form-group">
        <label for="security-question">Security Question *</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.02-.42 1.95-1.07 2.75z"/></svg>
          </span>
          <select id="security-question" required>
            <option value="" disabled selected>Choose a security question</option>
            <option value="city">What city were you born in?</option>
            <option value="school">What is the name of your school?</option>
            <option value="pet">What was the name of your first pet?</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="security-answer">Security Answer *</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          </span>
          <input type="text" id="security-answer" placeholder="Enter your answer" required>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms" style="font-weight: 400; font-size: 0.85rem;">I agree to <a href="#">Terms & Conditions</a></label>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Create Account</button>
    </form>

    <div class="login-link-text">
      Already have an account? <a href="index.html">Login</a>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errBox = document.getElementById('errorAlert');
      errBox.style.display = 'none';

      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const securityQuestion = document.getElementById('security-question').value;
      const securityAnswer = document.getElementById('security-answer').value.trim();
      const terms = document.getElementById('terms').checked;
      const btn = document.getElementById('submitBtn');

      if (!terms) {
        errBox.textContent = 'Please accept the Terms & Conditions.';
        errBox.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errBox.textContent = 'Password must be at least 6 characters long.';
        errBox.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errBox.textContent = 'Passwords do not match.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        // 1. Create account with Firebase Authentication
        const userCred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        const user = userCred.user;
        const userKey = user.uid;

        // 2. Save local session immediately for instant access
        localStorage.setItem('expenseX_userkey', userKey);
        localStorage.setItem('expenseX_fullname', fullname);
        localStorage.setItem(`expenseX_saved_name_${userKey}`, fullname);
        localStorage.setItem('expenseX_email', email);
        localStorage.setItem('expenseX_phone', phone);
        localStorage.removeItem('expenseX_pending_otp');
        localStorage.setItem('expenseX_otp_verified', 'true');

        // 3. Fire-and-forget profile display name update in background
        user.updateProfile({ displayName: fullname }).catch(() => {});

        // 4. Fire-and-forget Cloud Firestore profile sync in background
        if (window.firebase && window.firebase.firestore) {
          try {
            const db = firebase.firestore();
            db.collection('users').doc(userKey).set({
              uid: userKey,
              fullName: fullname,
              email: email,
              phone: phone,
              securityQuestion: securityQuestion,
              securityAnswer: securityAnswer,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
              isOnline: true
            }, { merge: true }).catch(() => {});
          } catch (e) {}
        }

        // 5. Instantly redirect straight to Dashboard!
        window.location.href = 'dashboard.html';

      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Create Account';
        
        let message = err.message || 'Registration failed.';
        if (err.code === 'auth/email-already-in-use') {
          message = 'This email is already registered. Please login or use Forgot Password.';
        } else if (err.code === 'auth/invalid-email') {
          message = 'Please provide a valid email address.';
        } else if (err.code === 'auth/weak-password') {
          message = 'Password is too weak. Please use at least 6 characters.';
        } else if (err.code === 'auth/network-request-failed') {
          message = 'Network error. Please check your internet connection.';
        }

        errBox.textContent = message;
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
