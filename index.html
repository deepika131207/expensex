<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseX - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #7c3aed;
      --primary-dark: #6d28d9;
      --bg-color: #7b5ac6;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 950px;
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .brand-header-center {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 1.5rem;
    }

    .brand-graphic {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-svg {
      width: 48px;
      height: 48px;
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--success);
    }

    .brand-name .x-accent {
      color: var(--primary-color);
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand-tagline .dash {
      display: inline-block;
      width: 10px;
      height: 1px;
      background-color: var(--primary-color);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 0.75rem 2.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #fff;
    }

    input:focus {
      border-color: var(--success);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .checkbox-container input {
      width: auto;
      padding: 0;
    }

    .link {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .link:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--success);
      color: white;
    }

    .btn-primary:hover {
      background-color: #059669;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      margin: 0.5rem 0;
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider::before { margin-right: .75em; }
    .divider::after { margin-left: .75em; }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-secondary:hover {
      background-color: rgba(124, 58, 237, 0.05);
    }

    .footer-note {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      display: none;
      padding: 0.5rem;
      background: #fee2e2;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <main class="card">
    <header class="brand-header-center">
      <div class="brand-graphic">
        <svg viewBox="0 0 100 100" class="brand-svg">
          <path d="M 46 14 A 32 32 0 1 0 74 62" fill="none" stroke="#10b981" stroke-width="6.5" stroke-linecap="round" />
          <polygon points="46,6 46,22 34,14" fill="#10b981" />
          <text x="44" y="58" text-anchor="middle" font-size="34" font-weight="900" fill="#10b981" font-family="'Poppins', sans-serif">₹</text>
          <line x1="58" y1="46" x2="80" y2="24" stroke="#7c3aed" stroke-width="5.5" stroke-linecap="round" />
          <polygon points="85,20 72,21 82,32" fill="#7c3aed" />
          <path d="M 52 82 L 52 70 L 64 70 L 64 56 L 76 56 L 76 42 L 86 42 L 86 82 Z" fill="#7c3aed" />
        </svg>
      </div>
      <div>
        <h1 class="brand-name">Expense<span class="x-accent">X</span></h1>
        <p class="brand-tagline"><span class="dash"></span> Track Expenses. Manage Better. Save More. <span class="dash"></span></p>
      </div>
    </header>

    <div id="errorAlert" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="fa-regular fa-envelope field-icon"></i>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock field-icon"></i>
          <input type="password" id="password" placeholder="Enter your password" required />
          <i class="fa-regular fa-eye toggle-password" id="eyeIcon" onclick="togglePassword()"></i>
        </div>
      </div>

      <div class="form-row">
        <label class="checkbox-container">
          <input type="checkbox" id="showPasswordCheck" onchange="syncPassword(this.checked)" />
          <span>Show Password</span>
        </label>
        <a href="#" class="link" onclick="handleForgotPassword(); return false;">Forgot password?</a>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary">
        <span>₹</span> Login
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <a href="register.html" class="btn btn-secondary">
        <i class="fa-solid fa-user-plus"></i> Create New Account
      </a>

      <div class="footer-note">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Your data is secure with us</span>
      </div>
    </form>
  </main>

  <script src="js/firebase-config.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const showPasswordCheck = document.getElementById('showPasswordCheck');
    const errorAlert = document.getElementById('errorAlert');

    function togglePassword() {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.classList.toggle('fa-eye', !isPassword);
      eyeIcon.classList.toggle('fa-eye-slash', isPassword);
      showPasswordCheck.checked = isPassword;
    }

    function syncPassword(show) {
      passwordInput.type = show ? 'text' : 'password';
      eyeIcon.classList.toggle('fa-eye', !show);
      eyeIcon.classList.toggle('fa-eye-slash', show);
    }

    function handleForgotPassword() {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showError("Please enter your email above and click 'Forgot password?' to receive a reset link.");
        return;
      }
      firebase.auth().sendPasswordResetEmail(email)
        .then(() => alert(`Password reset link sent to ${email}!`))
        .catch(err => showError(err.message));
    }

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.style.display = 'block';
    }

    // Initialize Firebase
    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();

      // If user is already authenticated, redirect to dashboard
      firebase.auth().onAuthStateChanged(async (user) => {
        if (user) {
          const userKey = user.uid;
          localStorage.setItem('expenseX_userkey', userKey);
          localStorage.setItem('expenseX_email', user.email);
          localStorage.setItem('expenseX_fullname', user.displayName || user.email.split('@')[0]);

          // Restore data from Firestore into local cache
          try {
            const db = firebase.firestore();
            const doc = await db.collection('users').doc(userKey).collection('data').doc('budget_data').get();
            if (doc.exists) {
              const data = doc.data();
              if (data.expenses) localStorage.setItem(`expenseX_expenses_${userKey}`, JSON.stringify(data.expenses));
              if (data.budgets) localStorage.setItem(`expenseX_budgets_${userKey}`, JSON.stringify(data.budgets));
              if (data.categories) localStorage.setItem(`expenseX_categories_${userKey}`, JSON.stringify(data.categories));
            }
          } catch (e) {}

          window.location.replace('dashboard.html');
        }
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      errorAlert.style.display = 'none';
      const emailVal = document.getElementById('email').value.trim();
      const passwordVal = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.innerHTML = 'Logging in...';

      try {
        const userCred = await firebase.auth().signInWithEmailAndPassword(emailVal, passwordVal);
        const user = userCred.user;
        const userKey = user.uid;
        const name = user.displayName || emailVal.split('@')[0];

        // Store local session
        localStorage.setItem('expenseX_userkey', userKey);
        localStorage.setItem('expenseX_email', user.email);
        localStorage.setItem('expenseX_fullname', name);
        localStorage.setItem('expenseX_otp_verified', 'true');

        // Restore user data from Cloud Firestore Database
        try {
          const db = firebase.firestore();
          db.collection('users').doc(userKey).set({
            email: user.email.toLowerCase(),
            displayName: name,
            lastLoginAt: firebase.firestore.FieldValue.serverTimestamp(),
            loginCount: firebase.firestore.FieldValue.increment(1),
            isOnline: true
          }, { merge: true }).catch(() => {});

          // Fetch all saved budgets and expenses so they immediately appear!
          const dataDoc = await db.collection('users').doc(userKey).collection('data').doc('budget_data').get();
          if (dataDoc.exists) {
            const data = dataDoc.data();
            if (data.expenses) localStorage.setItem(`expenseX_expenses_${userKey}`, JSON.stringify(data.expenses));
            if (data.budgets) localStorage.setItem(`expenseX_budgets_${userKey}`, JSON.stringify(data.budgets));
            if (data.categories) localStorage.setItem(`expenseX_categories_${userKey}`, JSON.stringify(data.categories));
          }
        } catch (dbErr) {
          console.warn("Firestore data load notice:", dbErr);
        }

        window.location.replace('dashboard.html');
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<span>₹</span> Login';
        showError(err.message || 'Invalid email or password.');
      }
    });
  </script>
</body>
</html>
